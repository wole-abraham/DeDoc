<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeDoc AI Chat</title>
    <!-- Reuse global styles if applicable, or just use chat.css -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Minimal specific styles for standalone chat */
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-wrapper {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-header {
            background-color: #0084ff;
            color: white;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background: #f9f9f9;
        }

        #chat-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: all 0.2s;
        }

        #chat-input:focus {
            border-color: #0084ff;
            box-shadow: 0 0 0 2px rgba(0, 132, 255, 0.2);
        }

        #send-btn {
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }

        #send-btn:hover {
            transform: scale(1.05);
        }

        .extracted-info {
            padding: 5px 15px;
            font-size: 0.8rem;
            color: #666;
            border-bottom: 1px solid #eee;
        }

        .tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            font-size: 0.75rem;
        }

        .tag.positive {
            background: #e6f4ea;
            color: #137333;
        }

        .tag.negative {
            background: #fce8e6;
            color: #c5221f;
        }

        /* Message Bubbles - override chat.css slightly for this standalone structure */
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.4;
            position: relative;
            font-size: 0.95rem;
        }

        .message.bot {
            align-self: flex-start;
            background: #f0f2f5;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background: #0084ff;
            color: white;
            border-bottom-right-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="chat-wrapper">
        <div class="chat-header">
            <span>DeDoc Assistant</span>
            <!-- Optional close or more info -->
        </div>

        <div id="extracted-info" class="extracted-info">
            <!-- JS will populate symptoms here -->
        </div>

        <div id="chat-messages">
            <!-- Messages go here -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type your symptoms here..." autocomplete="off">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script src="chat.js"></script>
</body>

</html>
